<svg xmlns="http://www.w3.org/2000/svg" font-family="Source Sans 3, Helvetica, Arial, sans-serif" viewBox="0 0 1200 560" role="img" aria-label="Analytics Design View: three analytics goals, four candidate algorithms with positive and negative influence arrows to four softgoals, and satisfied/denied marks on the chosen champion."><rect width="1200" height="560" fill="#faf9f7"/>
        <defs>
          <marker id="arrSolid" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#1c1d1f"/>
          </marker>
          <marker id="arrDash" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#1c1d1f"/>
          </marker>
          <marker id="arrEvent" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#7a4fb5"/>
          </marker>
          <marker id="arrSync" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#1c1d1f"/>
          </marker>
        </defs>
        <!-- Analytics goals -->
        <ellipse cx="170" cy="90" rx="135" ry="48" fill="#dcebff" stroke="#2f5fa3" stroke-width="1.8"/>
        <text x="170" y="82" text-anchor="middle" font-size="11" font-weight="700">AG1 · Classification of</text>
        <text x="170" y="96" text-anchor="middle" font-size="11" font-weight="700">payment as fraud/genuine</text>
        <text x="170" y="112" text-anchor="middle" font-size="9.5" fill="#55585e">(PredictionGoal)</text>

        <ellipse cx="170" cy="260" rx="135" ry="48" fill="#dcebff" stroke="#2f5fa3" stroke-width="1.8"/>
        <text x="170" y="252" text-anchor="middle" font-size="11" font-weight="700">AG2 · Recommend triage</text>
        <text x="170" y="266" text-anchor="middle" font-size="11" font-weight="700">action, minimise cost</text>
        <text x="170" y="282" text-anchor="middle" font-size="9.5" fill="#55585e">(PrescriptionGoal)</text>

        <ellipse cx="170" cy="430" rx="135" ry="48" fill="#dcebff" stroke="#2f5fa3" stroke-width="1.8"/>
        <text x="170" y="422" text-anchor="middle" font-size="11" font-weight="700">AG3 · Explain the drivers</text>
        <text x="170" y="436" text-anchor="middle" font-size="11" font-weight="700">of each risk score</text>
        <text x="170" y="452" text-anchor="middle" font-size="9.5" fill="#55585e">(DescriptionGoal)</text>

        <!-- Algorithms (hexagons) -->
        <g>
          <!-- helper hexagon path generator inlined per-shape -->
          <polygon points="470,45 520,45 545,90 520,135 470,135 445,90" fill="#e3f6e8" stroke="#2f8f52" stroke-width="1.8"/>
          <text x="495" y="85" text-anchor="middle" font-size="10.5" font-weight="700">Logistic</text>
          <text x="495" y="98" text-anchor="middle" font-size="10.5" font-weight="700">Regression</text>

          <polygon points="470,155 520,155 545,200 520,245 470,245 445,200" fill="#e3f6e8" stroke="#2f8f52" stroke-width="1.8"/>
          <text x="495" y="195" text-anchor="middle" font-size="10.5" font-weight="700">Random</text>
          <text x="495" y="208" text-anchor="middle" font-size="10.5" font-weight="700">Forest</text>

          <polygon points="470,265 520,265 545,310 520,355 470,355 445,310" fill="#e3f6e8" stroke="#2f8f52" stroke-width="2.6"/>
          <text x="495" y="305" text-anchor="middle" font-size="10.5" font-weight="700">LightGBM</text>
          <text x="495" y="318" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">champion</text>

          <polygon points="470,375 520,375 545,420 520,465 470,465 445,420" fill="#e3f6e8" stroke="#2f8f52" stroke-width="1.8"/>
          <text x="495" y="415" text-anchor="middle" font-size="10.5" font-weight="700">Isolation</text>
          <text x="495" y="428" text-anchor="middle" font-size="10.5" font-weight="700">Forest</text>
        </g>

        <!-- AG -> Algorithm performs -->
        <line x1="305" y1="95" x2="445" y2="90" stroke="#1c1d1f" stroke-width="1.2"/>
        <line x1="305" y1="100" x2="445" y2="200" stroke="#1c1d1f" stroke-width="1.2"/>
        <line x1="305" y1="105" x2="445" y2="310" stroke="#1c1d1f" stroke-width="1.2"/>
        <line x1="305" y1="110" x2="445" y2="420" stroke="#1c1d1f" stroke-width="1.2"/>
        <text x="330" y="150" font-size="9" font-style="italic">performs</text>

        <!-- Softgoals (clouds approximated as rounded rects) -->
        <g fill="#f1e8fb" stroke="#7a4fb5" stroke-width="1.8">
          <rect x="760" y="30" width="190" height="56" rx="26"/>
          <rect x="760" y="130" width="190" height="56" rx="26"/>
          <rect x="760" y="230" width="190" height="56" rx="26"/>
          <rect x="760" y="330" width="190" height="56" rx="26"/>
          <rect x="760" y="430" width="190" height="56" rx="26"/>
        </g>
        <g font-size="10.5" font-weight="700" text-anchor="middle">
          <text x="855" y="54">Detection accuracy</text>
          <text x="855" y="68">(imbalanced data)</text>
          <text x="855" y="154">Low inference</text>
          <text x="855" y="168">latency</text>
          <text x="855" y="254">Interpretability</text>
          <text x="855" y="354">Tolerance to missing</text>
          <text x="855" y="368">values</text>
          <text x="855" y="454">Adaptability to</text>
          <text x="855" y="468">drift (cheap retrain)</text>
        </g>

        <!-- influence lines LightGBM (champion) to softgoals: positive solid, negative dashed -->
        <g stroke-width="1.3" fill="none">
          <path d="M545,290 C650,250 700,220 760,145" stroke="#2f8f52" stroke-dasharray="0" marker-end="url(#arrSolid)"/>
          <text x="640" y="220" font-size="9.5" fill="#2f8f52" font-weight="700">++</text>
          <path d="M545,300 C650,170 700,100 760,58" stroke="#2f8f52" marker-end="url(#arrSolid)"/>
          <text x="660" y="130" font-size="9.5" fill="#2f8f52" font-weight="700">+</text>
          <path d="M545,308 C650,300 700,290 760,260" stroke="#c0392b" stroke-dasharray="4,3" marker-end="url(#arrSolid)"/>
          <text x="660" y="300" font-size="9.5" fill="#c0392b" font-weight="700">&#8722;</text>
          <path d="M545,320 C650,350 700,355 760,358" stroke="#2f8f52" marker-end="url(#arrSolid)"/>
          <text x="660" y="355" font-size="9.5" fill="#2f8f52" font-weight="700">++</text>
          <path d="M545,330 C650,400 700,430 760,450" stroke="#2f8f52" marker-end="url(#arrSolid)"/>
          <text x="660" y="420" font-size="9.5" fill="#2f8f52" font-weight="700">+</text>
        </g>

        <!-- LR influence (dashed grey, for contrast) -->
        <g stroke-width="1.1" fill="none" opacity="0.55">
          <path d="M545,90 C650,70 700,60 760,58" stroke="#1c1d1f" marker-end="url(#arrSolid)"/>
          <text x="600" y="68" font-size="9" font-style="italic">LR: + latency, &#8722; accuracy</text>
        </g>

        <!-- satisfied / denied marks -->
        <text x="565" y="300" font-size="16" fill="#2f8f52">&#10003;</text>
        <text x="565" y="90" font-size="16" fill="#c0392b">&#10007;</text>
        <text x="565" y="420" font-size="16" fill="#c0392b">&#10007;</text>

        <!-- Legend -->
        <g transform="translate(20,480)" font-size="10">
          <text font-weight="700" font-size="11">Legend:</text>
          <polygon points="95,2 115,2 125,14 115,26 95,26 85,14" fill="#e3f6e8" stroke="#2f8f52"/>
          <text x="135" y="18">Algorithm</text>
          <ellipse cx="240" cy="14" rx="20" ry="10" fill="#dcebff" stroke="#2f5fa3"/>
          <text x="268" y="18">Analytics Goal</text>
          <rect x="360" y="2" width="56" height="22" rx="11" fill="#f1e8fb" stroke="#7a4fb5"/>
          <text x="424" y="18">Softgoal</text>
          <text x="500" y="18" fill="#2f8f52" font-weight="700">++/+ positive influence</text>
          <text x="700" y="18" fill="#c0392b" font-weight="700">&#8722;/&#8722;&#8722; negative</text>
          <text x="880" y="18">&#10003; satisfied &#160; &#10007; denied</text>
        </g>
      </svg>