<svg xmlns="http://www.w3.org/2000/svg" font-family="Source Sans 3, Helvetica, Arial, sans-serif" viewBox="0 0 1240 660" role="img" aria-label="Architecture diagram: a gateway and console call the ML scoring service synchronously; the gateway publishes decisions to a Redis event bus consumed by three independent non-ML services; an offline training pipeline registers models to MLflow which the scoring service reads."><rect width="1240" height="660" fill="#faf9f7"/>
        <defs>
          <marker id="arrSync" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#1c1d1f"/>
          </marker>
          <marker id="arrEvent" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#7a4fb5"/>
          </marker>
        </defs>

        <!-- Console (non-ML) -->
        <rect x="30" y="40" width="190" height="60" rx="8" fill="#fdeedb" stroke="#c07a1f" stroke-width="1.8"/>
        <text x="125" y="65" text-anchor="middle" font-size="12" font-weight="700">Analyst Console</text>
        <text x="125" y="82" text-anchor="middle" font-size="10" fill="#55585e">Streamlit :8501</text>

        <!-- triage-api (non-ML) -->
        <rect x="320" y="40" width="230" height="110" rx="8" fill="#fdeedb" stroke="#c07a1f" stroke-width="1.8"/>
        <text x="435" y="64" text-anchor="middle" font-size="12" font-weight="700">triage-api :8000</text>
        <text x="435" y="80" text-anchor="middle" font-size="9.5" fill="#55585e">Gateway + Orchestrator</text>
        <text x="435" y="96" text-anchor="middle" font-size="9" fill="#55585e">auth · hard rules · heartbeat</text>
        <text x="435" y="110" text-anchor="middle" font-size="9" fill="#55585e">cost-based policy · publish</text>
        <text x="435" y="136" text-anchor="middle" font-size="9" fill="#c07a1f" font-weight="700">non-ML</text>

        <!-- scoring (ML) -->
        <rect x="320" y="200" width="230" height="110" rx="8" fill="#e3f0ff" stroke="#2f5fa3" stroke-width="1.8"/>
        <text x="435" y="224" text-anchor="middle" font-size="12" font-weight="700">scoring :8001</text>
        <text x="435" y="240" text-anchor="middle" font-size="9.5" fill="#55585e">pipe-and-filter</text>
        <text x="435" y="256" text-anchor="middle" font-size="9" fill="#55585e">validate &#8594; features &#8594;</text>
        <text x="435" y="270" text-anchor="middle" font-size="9" fill="#55585e">predict &#8594; SHAP explain</text>
        <text x="435" y="296" text-anchor="middle" font-size="9" fill="#2f5fa3" font-weight="700">ML</text>

        <!-- Online Feature Store -->
        <rect x="620" y="200" width="190" height="60" rx="8" fill="#e3f0ff" stroke="#2f5fa3" stroke-width="1.8"/>
        <text x="715" y="224" text-anchor="middle" font-size="11.5" font-weight="700">Online Feature Store</text>
        <text x="715" y="240" text-anchor="middle" font-size="9.5" fill="#55585e">Redis sorted sets (24h)</text>
        <text x="715" y="253" text-anchor="middle" font-size="9" fill="#2f5fa3" font-weight="700">ML</text>

        <!-- MLflow -->
        <rect x="620" y="40" width="190" height="60" rx="8" fill="#e3f0ff" stroke="#2f5fa3" stroke-width="1.8"/>
        <text x="715" y="64" text-anchor="middle" font-size="11.5" font-weight="700">MLflow Registry</text>
        <text x="715" y="80" text-anchor="middle" font-size="9.5" fill="#55585e">tracking + model registry</text>
        <text x="715" y="93" text-anchor="middle" font-size="9" fill="#2f5fa3" font-weight="700">ML</text>

        <!-- Event bus -->
        <rect x="320" y="360" width="560" height="56" rx="8" fill="#f1e8fb" stroke="#7a4fb5" stroke-width="1.8"/>
        <text x="600" y="383" text-anchor="middle" font-size="12" font-weight="700">Redis Streams — payment.decided</text>
        <text x="600" y="399" text-anchor="middle" font-size="9.5" fill="#55585e">consumer groups, at-least-once delivery, XAUTOCLAIM replay</text>

        <!-- Consumers (non-ML) -->
        <rect x="50" y="460" width="190" height="70" rx="8" fill="#fdeedb" stroke="#c07a1f" stroke-width="1.8"/>
        <text x="145" y="485" text-anchor="middle" font-size="11.5" font-weight="700">case-service :8002</text>
        <text x="145" y="501" text-anchor="middle" font-size="9" fill="#55585e">opens/resolves cases</text>
        <text x="145" y="515" text-anchor="middle" font-size="9" fill="#55585e">(FR5, FR6 feedback loop)</text>

        <rect x="300" y="460" width="190" height="70" rx="8" fill="#e3f0ff" stroke="#2f5fa3" stroke-width="1.8"/>
        <text x="395" y="485" text-anchor="middle" font-size="11.5" font-weight="700">feature-updater</text>
        <text x="395" y="501" text-anchor="middle" font-size="9" fill="#55585e">writes velocity state</text>
        <text x="395" y="515" text-anchor="middle" font-size="9" fill="#55585e">(FR7)</text>

        <rect x="550" y="460" width="190" height="70" rx="8" fill="#fdeedb" stroke="#c07a1f" stroke-width="1.8"/>
        <text x="645" y="485" text-anchor="middle" font-size="11.5" font-weight="700">monitor :8003</text>
        <text x="645" y="501" text-anchor="middle" font-size="9" fill="#55585e">PSI drift, decision mix,</text>
        <text x="645" y="515" text-anchor="middle" font-size="9" fill="#55585e">latency (FR8)</text>

        <!-- Offline training pipeline -->
        <rect x="900" y="40" width="300" height="270" rx="8" fill="#ffffff" stroke="#c7c9cd" stroke-width="1.6" stroke-dasharray="5,4"/>
        <text x="1050" y="62" text-anchor="middle" font-size="11.5" font-weight="700">Offline Training Pipeline</text>
        <g font-size="9.5" text-anchor="middle" fill="#55585e">
          <text x="1050" y="85">PaySim CSV</text>
        </g>
        <line x1="1050" y1="92" x2="1050" y2="108" stroke="#1c1d1f" stroke-width="1.2" marker-end="url(#arrSync)"/>
        <rect x="940" y="110" width="220" height="34" fill="#faf9f7" stroke="#1c1d1f" stroke-width="1.2"/>
        <text x="1050" y="131" text-anchor="middle" font-size="10">build_features.py</text>
        <line x1="1050" y1="144" x2="1050" y2="158" stroke="#1c1d1f" stroke-width="1.2" marker-end="url(#arrSync)"/>
        <rect x="940" y="160" width="220" height="34" fill="#faf9f7" stroke="#1c1d1f" stroke-width="1.2"/>
        <text x="1050" y="181" text-anchor="middle" font-size="10">train.py (LR / RF / LightGBM)</text>
        <line x1="1050" y1="194" x2="1050" y2="208" stroke="#1c1d1f" stroke-width="1.2" marker-end="url(#arrSync)"/>
        <rect x="940" y="210" width="220" height="34" fill="#faf9f7" stroke="#1c1d1f" stroke-width="1.2"/>
        <text x="1050" y="231" text-anchor="middle" font-size="10">select_thresholds.py</text>
        <line x1="1050" y1="244" x2="1050" y2="258" stroke="#1c1d1f" stroke-width="1.2" marker-end="url(#arrSync)"/>
        <rect x="940" y="260" width="220" height="34" fill="#faf9f7" stroke="#1c1d1f" stroke-width="1.2"/>
        <text x="1050" y="281" text-anchor="middle" font-size="10">register.py &#8594; quality gate</text>

        <!-- sync arrows -->
        <g stroke="#1c1d1f" stroke-width="1.4" marker-end="url(#arrSync)" fill="none">
          <line x1="220" y1="70" x2="320" y2="70"/>
          <line x1="435" y1="150" x2="435" y2="200"/>
          <line x1="550" y1="255" x2="620" y2="230"/>
          <line x1="550" y1="85" x2="620" y2="70"/>
        </g>
        <text x="235" y="63" font-size="9" font-style="italic">HTTP</text>
        <text x="440" y="178" font-size="9" font-style="italic">HTTP (100ms timeout)</text>
        <text x="555" y="215" font-size="9" font-style="italic">read/write</text>
        <text x="555" y="63" font-size="9" font-style="italic">load champion</text>

        <!-- registry arrow from pipeline to mlflow -->
        <path d="M940,277 C860,277 820,70 810,70" fill="none" stroke="#1c1d1f" stroke-width="1.4" marker-end="url(#arrSync)"/>
        <text x="845" y="200" font-size="9" font-style="italic" transform="rotate(-90,845,200)">register champion</text>

        <!-- event publish (dashed, purple) -->
        <path d="M435,150 C435,300 435,340 435,360" fill="none" stroke="#7a4fb5" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrEvent)"/>
        <text x="450" y="340" font-size="9.5" fill="#7a4fb5" font-style="italic">publish</text>

        <!-- event -> consumers (dashed) -->
        <g stroke="#7a4fb5" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrEvent)">
          <path d="M400,416 C300,440 200,445 145,460"/>
          <path d="M500,416 C460,430 420,445 395,460"/>
          <path d="M700,416 C680,430 660,445 645,460"/>
        </g>

        <!-- console -> triage-api -->
        <path d="M220,70 L320,70" fill="none"/>

        <!-- Legend -->
        <g transform="translate(900,330)" font-size="10.5">
          <rect width="300" height="140" rx="6" fill="#faf9f7" stroke="#c7c9cd"/>
          <text x="150" y="20" text-anchor="middle" font-weight="700" font-size="12">Legend</text>
          <rect x="14" y="32" width="24" height="16" fill="#e3f0ff" stroke="#2f5fa3"/>
          <text x="46" y="44">ML component</text>
          <rect x="14" y="54" width="24" height="16" fill="#fdeedb" stroke="#c07a1f"/>
          <text x="46" y="66">non-ML component</text>
          <rect x="14" y="76" width="24" height="16" fill="#f1e8fb" stroke="#7a4fb5"/>
          <text x="46" y="88">Event bus</text>
          <line x1="14" y1="104" x2="38" y2="104" stroke="#1c1d1f" stroke-width="1.4" marker-end="url(#arrSync)"/>
          <text x="46" y="108">synchronous call</text>
          <line x1="14" y1="122" x2="38" y2="122" stroke="#7a4fb5" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrEvent)"/>
          <text x="46" y="126">async event (pub-sub)</text>
        </g>
      </svg>